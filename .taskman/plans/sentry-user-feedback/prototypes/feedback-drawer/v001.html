<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SecRandom Feedback</title><style>:root{--bg:#f4f5f7;--surface:#fff;--line:#e2e5e9;--text:#1c1d20;--muted:#6b717b;--accent:#0e7490;--accent-soft:#e6f5f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",sans-serif;color:var(--text);background:var(--bg);letter-spacing:0}.app{min-height:100vh;display:grid;grid-template-rows:48px 1fr}.topbar{padding:0 20px;display:flex;align-items:center;gap:12px;background:#fbfbfc;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.brand{color:var(--text);font-weight:600}.shell{display:grid;grid-template-columns:210px 1fr;min-height:0}.nav{background:#fafafb;border-right:1px solid var(--line);padding:18px 12px}.nav-title{padding:8px 12px 14px;font-size:12px;color:var(--muted)}.nav-item{padding:9px 12px;border-radius:5px;font-size:14px;margin:2px 0;color:#3a3e45}.nav-item.active{background:#e9eef0;color:#145464;font-weight:600}.content{padding:38px 56px}.content h1{font-size:25px;font-weight:600;margin:0 0 9px}.content p{color:var(--muted);margin:0;font-size:14px}.faux-row{margin-top:34px;height:62px;max-width:650px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:#3e4248;font-size:14px}.overlay{position:fixed;inset:48px 0 0;background:rgba(20,24,29,.18)}.drawer{position:fixed;top:48px;right:0;width:min(460px,100vw);height:calc(100vh - 48px);background:var(--surface);box-shadow:0 12px 34px rgba(25,32,44,.16);display:grid;grid-template-rows:auto 1fr auto}.drawer-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.drawer-head h2{font-size:20px;font-weight:600;margin:0 0 4px}.drawer-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.close{display:flex;align-items:center;gap:7px;height:32px;padding:0 8px;border:1px solid transparent;border-radius:5px;background:transparent;color:#505761;cursor:pointer;font:inherit;font-size:13px}.close:hover{background:#f2f3f5;border-color:var(--line)}.close-mark{font-size:20px;line-height:1;font-weight:300}.form{padding:20px;overflow:auto}.field-label{display:block;margin:0 0 9px;font-size:13px;font-weight:600}.optional{color:var(--muted);font-weight:400;margin-left:5px}.segmented{display:grid;grid-template-columns:1fr 1.25fr;gap:6px;padding:4px;background:#f1f3f5;border-radius:6px}.segment{min-height:38px;border:0;background:transparent;border-radius:4px;color:#59606a;font:inherit;font-size:13px;cursor:pointer}.segment.active{background:#fff;color:#174e5b;box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}.hint{display:flex;gap:9px;padding:10px 11px;margin:16px 0 18px;border-left:3px solid var(--accent);background:var(--accent-soft);color:#235663;font-size:12px;line-height:1.45}.hint strong{font-weight:600}textarea{width:100%;min-height:138px;resize:vertical;border:1px solid #cbd0d7;border-radius:5px;padding:10px 11px;font:inherit;font-size:14px;line-height:1.5;color:var(--text);outline:none}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(14,116,144,.13)}textarea::placeholder{color:#9ca2aa}.counter{text-align:right;margin-top:5px;color:var(--muted);font-size:11px}.upload{margin-top:20px}.drop{min-height:88px;border:1px dashed #aeb8c1;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:10px;color:#47606a;background:#fbfdfe;cursor:pointer;font-size:13px}.drop:hover{border-color:var(--accent);background:#f4fbfc}.upload-icon{width:28px;height:28px;border-radius:5px;background:#e5f2f4;display:grid;place-items:center;color:#0e7490;font-size:17px}.files{display:flex;gap:8px;margin-top:10px}.file{min-width:0;flex:1;display:flex;align-items:center;gap:7px;padding:7px;border:1px solid var(--line);border-radius:5px;background:#fff}.thumb{width:28px;height:28px;border-radius:3px;background:linear-gradient(145deg,#b8d3d9,#deebe7);flex:0 0 auto}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#505762;font-size:11px}.remove{border:0;background:transparent;color:#7d838b;font-size:16px;line-height:1;cursor:pointer}.privacy{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.5}.footer{border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:flex-end;align-items:center;gap:9px;background:#fff}button{font-family:inherit}.secondary,.primary{height:34px;border-radius:5px;padding:0 13px;font-size:13px;cursor:pointer}.secondary{border:1px solid #cbd1d7;background:#fff;color:#454c55}.secondary:hover{background:#f5f6f7}.primary{border:1px solid #0e7490;background:var(--accent);color:#fff}.primary:hover{background:#0b657c}.toast{display:none;position:fixed;right:480px;bottom:26px;padding:10px 14px;background:#1e6d54;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:5px;font-size:13px}@media(max-width:720px){.shell{grid-template-columns:1fr}.nav{display:none}.content{padding:26px 20px}.drawer{top:0;height:100vh}.overlay{inset:0}.topbar{display:none}.toast{right:20px;bottom:82px}}</style></head><body><div class="app"><header class="topbar"><span class="brand">SecRandom</span><span>/ 设置</span><span style="margin-left:auto">...</span></header><div class="shell"><aside class="nav"><div class="nav-title">设置</div><div class="nav-item active">概览</div><div class="nav-item">常规</div><div class="nav-item">个性化</div><div class="nav-item">抽取设置</div><div class="nav-item">通知</div></aside><main class="content"><h1>设置概览</h1><p>管理 SecRandom 的应用偏好与数据。</p><div class="faux-row"><span>外观</span><span>›</span></div><div class="faux-row"><span>隐私</span><span>›</span></div></main></div></div><div class="overlay"></div><aside class="drawer"><header class="drawer-head"><div><h2>反馈</h2><p>帮助我们定位问题，持续改进体验。</p></div><button class="close" id="close"><span class="close-mark">×</span><span>暂时关闭</span></button></header><main class="form"><label class="field-label">反馈类型</label><div class="segmented"><button class="segment active" data-type="bug">Bug</button><button class="segment" data-type="idea">新功能 / 优化体验</button></div><div class="hint" id="diagnostics"><span>ⓘ</span><span><strong>将附带诊断信息</strong><br>包含已脱敏的运行时信息与最近日志，不含名单、历史、设置或安全凭据。</span></div><label class="field-label" for="message">反馈内容</label><textarea id="message" maxlength="4000" placeholder="请描述发生了什么、你的预期，以及如何稳定复现问题。"></textarea><div class="counter"><span id="count">0</span> / 4000</div><section class="upload"><label class="field-label">截图 <span class="optional">可选</span></label><div class="drop" id="drop"><span class="upload-icon">＋</span><span>添加图片</span></div><div class="files" id="files"><div class="file"><span class="thumb"></span><span class="file-name">drawing-result.png</span><button class="remove" title="移除截图">×</button></div><div class="file"><span class="thumb" style="background:linear-gradient(145deg,#d2c6b0,#e9f2ee)"></span><span class="file-name">settings.png</span><button class="remove" title="移除截图">×</button></div></div></section><p class="privacy">提交反馈即表示你同意将填写内容、主动选择的截图以及上方说明的诊断附件发送至 Sentry。</p></main><footer class="footer"><button class="secondary" id="cancel">取消反馈</button><button class="primary" id="submit">提交反馈</button></footer></aside><div class="toast" id="toast">反馈已提交，感谢你的帮助。</div><script>const s=document.querySelectorAll('.segment'),d=document.getElementById('diagnostics'),m=document.getElementById('message'),c=document.getElementById('count'),f=document.getElementById('files'),t=document.getElementById('toast');s.forEach(x=>x.addEventListener('click',()=>{s.forEach(y=>y.classList.remove('active'));x.classList.add('active');d.style.display=x.dataset.type==='bug'?'flex':'none';m.placeholder=x.dataset.type==='bug'?'请描述发生了什么、你的预期，以及如何稳定复现问题。':'告诉我们你的使用场景、期待的功能或可以改进的地方。'}));m.addEventListener('input',()=>c.textContent=m.value.length);document.querySelectorAll('.remove').forEach(x=>x.addEventListener('click',()=>x.parentElement.remove()));document.getElementById('drop').addEventListener('click',()=>{let x=document.createElement('div');x.className='file';x.innerHTML='<span class="thumb"></span><span class="file-name">screenshot.png</span><button class="remove">×</button>';x.querySelector('.remove').onclick=()=>x.remove();f.appendChild(x)});document.getElementById('cancel').addEventListener('click',()=>{m.value='';c.textContent='0';f.innerHTML=''});document.getElementById('submit').addEventListener('click',()=>{if(!m.value.trim()){m.focus();return}t.style.display='block';setTimeout(()=>t.style.display='none',2600)});document.getElementById('close').addEventListener('click',()=>document.querySelector('.drawer').style.transform='translateX(100%)');</script></body></html>
