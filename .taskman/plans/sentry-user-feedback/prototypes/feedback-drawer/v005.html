<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SecRandom - 反馈</title><style>:root{--bg:#f4f5f7;--surface:#fff;--line:#e1e4e8;--text:#1d2024;--muted:#6a727c;--accent:#0e7490;--soft:#e9f6f8;--warn:#235663}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"MiSans","Segoe UI",sans-serif;letter-spacing:0}.shell{height:100vh;display:grid;grid-template-columns:220px 1fr}.nav{padding:24px 12px;background:#fafafb;border-right:1px solid var(--line)}.nav small{display:block;padding:0 12px 12px;color:var(--muted)}.nav div{padding:9px 12px;border-radius:5px;font-size:14px}.nav .active{background:#e8eef0;color:#145464;font-weight:600}.page{padding:42px 56px}.page h1{margin:0 0 8px;font-size:25px}.page p{margin:0;color:var(--muted);font-size:14px}.rows{margin-top:36px;max-width:660px}.row{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:14px}.veil{position:fixed;inset:0;background:rgba(27,31,36,.18)}.drawer{position:fixed;right:0;top:0;width:min(470px,100vw);height:100vh;background:var(--surface);box-shadow:0 12px 34px rgba(25,32,44,.17);display:grid;grid-template-rows:auto 1fr auto}.head{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.head h2{margin:0;font-size:20px}button{font-family:inherit;cursor:pointer}.close{height:32px;display:flex;gap:7px;align-items:center;padding:0 8px;background:transparent;border:1px solid transparent;border-radius:5px;color:#4f5760;font-size:13px}.close:hover{background:#f2f4f5;border-color:var(--line)}.x{font-size:20px;font-weight:300}.body{overflow:auto;padding:20px}.label{display:block;margin:0 0 8px;font-size:13px;font-weight:600}.need{color:#b42318;margin-left:3px}.segments{display:grid;grid-template-columns:1fr 1.25fr;gap:5px;padding:4px;background:#f0f2f4;border-radius:6px;margin-bottom:17px}.seg{height:38px;border:0;border-radius:4px;background:transparent;color:#59616c;font-size:13px}.seg.active{background:#fff;color:#164e5c;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}input,textarea{display:block;width:100%;border:1px solid #cbd1d7;border-radius:5px;padding:9px 10px;color:var(--text);font:14px/1.45 inherit;outline:none;background:#fff}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(14,116,144,.13)}textarea{height:84px;resize:vertical}textarea.steps{height:106px}.group{margin-top:17px}.hint{display:flex;gap:9px;margin:17px 0;padding:10px 11px;border-left:3px solid var(--accent);background:var(--soft);font-size:12px;line-height:1.45;color:var(--warn)}.hint b{font-weight:600}.privacy{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.5}.feature{display:none}.foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px}.github,.secondary,.primary{height:34px;border-radius:5px;font-size:13px}.github{display:flex;align-items:center;gap:7px;padding:0 12px;border:1px solid #cbd1d7;background:#fff;color:#343a42}.github:hover,.secondary:hover{background:#f5f6f7}.github img{width:16px;height:16px;object-fit:contain}.actions{margin-left:auto;display:flex;gap:9px}.secondary{padding:0 13px;background:#fff;border:1px solid #cbd1d7;color:#454d56}.primary{padding:0 13px;background:var(--accent);border:1px solid var(--accent);color:#fff}@media(max-width:700px){.shell{display:none}.drawer{width:100%}}</style></head><body><div class="shell"><aside class="nav"><small>设置</small><div class="active">概览</div><div>常规</div><div>个性化</div><div>抽取设置</div><div>通知</div></aside><main class="page"><h1>设置概览</h1><p>管理 SecRandom 的应用偏好与数据。</p><div class="rows"><div class="row">外观 <span>›</span></div><div class="row">隐私 <span>›</span></div></div></main></div><div class="veil"></div><aside class="drawer"><header class="head"><h2>反馈</h2><button class="close" title="保留当前内容并关闭"><span class="x">×</span>暂时关闭</button></header><main class="body"><label class="label">反馈类型</label><div class="segments"><button class="seg active" data-kind="bug">Bug</button><button class="seg" data-kind="feature">新功能 / 优化体验</button></div><div class="group"><label class="label">简要标题 <span class="need">*</span></label><input placeholder="用一句话概括问题或建议"></div><section class="bug"><div class="hint"><span>ⓘ</span><span><b>将自动上传诊断信息</b><br>提交时生成与“导出诊断数据”相同的脱敏 ZIP 附件，用于问题定位。</span></div><div class="group"><label class="label">期望的行为 <span class="need">*</span></label><textarea placeholder="描述你期望发生的行为。"></textarea></div><div class="group"><label class="label">实际结果 <span class="need">*</span></label><textarea placeholder="描述实际发生的行为。"></textarea></div><div class="group"><label class="label">重现步骤 <span class="need">*</span></label><textarea class="steps" placeholder="1. 首先……&#10;2. 然后……&#10;3. ……。"></textarea></div></section><section class="feature"><div class="group"><label class="label">背景与动机 <span class="need">*</span></label><textarea placeholder="为什么需要这个功能？它解决了什么场景？"></textarea></div><div class="group"><label class="label">想要实现或优化的功能 <span class="need">*</span></label><textarea class="steps" placeholder="尽量具体地说明期望的功能、流程或体验改进。"></textarea></div></section><p class="privacy">提交反馈会发送填写内容；Bug 还会自动上传上述脱敏诊断 ZIP。此操作不改变你的 Sentry 遥测设置。</p></main><footer class="foot"><button class="github"><img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="">GitHub</button><div class="actions"><button class="secondary" id="clear">取消反馈</button><button class="primary">提交反馈</button></div></footer></aside><script>const bug=document.querySelector('.bug'),feature=document.querySelector('.feature'),segments=document.querySelectorAll('.seg');segments.forEach(x=>x.onclick=()=>{segments.forEach(y=>y.classList.remove('active'));x.classList.add('active');bug.style.display=x.dataset.kind==='bug'?'block':'none';feature.style.display=x.dataset.kind==='feature'?'block':'none'});document.getElementById('clear').onclick=()=>document.querySelectorAll('input,textarea').forEach(x=>x.value='');</script></body></html>
